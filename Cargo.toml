[package]
name = "codex-sw"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A cross-platform Codex provider switcher with credential-aware imports"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
tempfile = "3"
toml_edit = "0.25"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Memory"] }

[profile.release]
lto = "thin"
strip = true
